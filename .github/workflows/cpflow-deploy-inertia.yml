name: Deploy Inertia to Control Plane

run-name: Deploy Inertia staging app

on:
  push:
    branches: ["ramez/cpln/cpflow"]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full deployment-capable source commit SHA (defaults to this workflow commit)
        required: false
        type: string

permissions:
  contents: read

env:
  APP_NAME: gumroad-inertia
  CPLN_ORG: ${{ vars.CPLN_ORG_STAGING }}
  STAGING_APP_BRANCH: ramez/cpln/cpflow

concurrency:
  group: cpflow-deploy-inertia-${{ github.ref == 'refs/heads/ramez/cpln/cpflow' && 'ramez/cpln/cpflow' || github.run_id }}
  # A cancelled deploy-image can leave some workloads on the new image and others on the old.
  cancel-in-progress: false

jobs:
  validate-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      is_deployable: ${{ steps.check-branch.outputs.is_deployable }}
      source_sha: ${{ steps.resolve-source.outputs.source_sha }}
    steps:
      - name: Check whether this branch should deploy staging
        id: check-branch
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${STAGING_APP_BRANCH}" ]]; then
            if [[ "${GITHUB_REF_NAME}" == "${STAGING_APP_BRANCH}" ]]; then
              echo "is_deployable=true" >> "$GITHUB_OUTPUT"
            else
              echo "Branch '${GITHUB_REF_NAME}' does not match STAGING_APP_BRANCH='${STAGING_APP_BRANCH}'"
              echo "is_deployable=false" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "${GITHUB_REF_NAME}" == "main" || "${GITHUB_REF_NAME}" == "master" ]]; then
            echo "is_deployable=true" >> "$GITHUB_OUTPUT"
          else
            echo "Branch '${GITHUB_REF_NAME}' is not main/master and no STAGING_APP_BRANCH is configured"
            echo "is_deployable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout deployment history
        if: steps.check-branch.outputs.is_deployable == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Resolve deployment source
        if: steps.check-branch.outputs.is_deployable == 'true'
        id: resolve-source
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          source_sha="${REQUESTED_SOURCE_SHA:-${GITHUB_SHA}}"
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi
          if ! resolved_sha="$(git rev-parse --verify "${source_sha}^{commit}" 2>/dev/null)"; then
            echo "source_sha is not a known commit in the fetched repository history" >&2
            exit 1
          fi
          if [[ "$resolved_sha" != "$source_sha" ]]; then
            echo "source_sha must identify the commit itself, not a tag object" >&2
            exit 1
          fi
          # Earlier application commits lack the paired demos' Control Plane runtime support.
          if ! git merge-base --is-ancestor 5df1b6827002108389e337bbe308896d49da30a1 "$resolved_sha"; then
            echo "source_sha must include the paired-demo deployment foundation" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$resolved_sha" "$GITHUB_SHA"; then
            echo "source_sha must already belong to this deployment branch's history" >&2
            exit 1
          fi
          echo "source_sha=$resolved_sha" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployment provenance"
            echo "- App: ${APP_NAME}"
            echo "- Workflow commit: ${GITHUB_SHA}"
            echo "- Application commit: ${resolved_sha}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout control-plane-flow actions
        if: steps.check-branch.outputs.is_deployable == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: shakacode/control-plane-flow
          ref: 1d1ec7f7af181c5c6cf07f512ce336dbdb367246
          path: .cpflow
          persist-credentials: false

      - name: Validate required secrets and variables
        if: steps.check-branch.outputs.is_deployable == 'true'
        uses: ./.cpflow/.github/actions/cpflow-validate-config
        env:
          CPLN_TOKEN_STAGING: ${{ secrets.CPLN_TOKEN_STAGING }}
          CPLN_ORG_STAGING: ${{ vars.CPLN_ORG_STAGING }}
          STAGING_APP_NAME: ${{ env.APP_NAME }}
        with:
          required: |
            secret:CPLN_TOKEN_STAGING
            variable:CPLN_ORG_STAGING
            variable:STAGING_APP_NAME

  build:
    needs: validate-branch
    if: needs.validate-branch.outputs.is_deployable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate-branch.outputs.source_sha }}
          persist-credentials: false

      - name: Checkout control-plane-flow actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: shakacode/control-plane-flow
          ref: 1d1ec7f7af181c5c6cf07f512ce336dbdb367246
          path: .cpflow
          persist-credentials: false

      - name: Setup environment
        uses: ./.cpflow/.github/actions/cpflow-setup-environment
        with:
          token: ${{ secrets.CPLN_TOKEN_STAGING }}
          org: ${{ vars.CPLN_ORG_STAGING }}
          working_directory: .cpflow
          cpln_cli_version: ${{ vars.CPLN_CLI_VERSION }}
          cpflow_version: ${{ vars.CPFLOW_VERSION }}
          control_plane_flow_ref: shakacode/control-plane-flow/.github/workflows/cpflow-deploy-staging.yml@refs/tags/v5.2.0

      - name: Build Docker image
        uses: ./.cpflow/.github/actions/cpflow-build-docker-image
        with:
          app_name: ${{ env.APP_NAME }}
          org: ${{ vars.CPLN_ORG_STAGING }}
          commit: ${{ needs.validate-branch.outputs.source_sha }}
          docker_build_extra_args: |
            ${{ vars.DOCKER_BUILD_EXTRA_ARGS }}
            --build-arg=BENCHMARK_APP=${{ env.APP_NAME }}
          docker_build_ssh_key: ${{ secrets.DOCKER_BUILD_SSH_KEY }}
          docker_build_ssh_known_hosts: ${{ vars.DOCKER_BUILD_SSH_KNOWN_HOSTS }}

  deploy:
    needs: [validate-branch, build]
    if: needs.validate-branch.outputs.is_deployable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate-branch.outputs.source_sha }}
          persist-credentials: false

      - name: Checkout control-plane-flow actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: shakacode/control-plane-flow
          ref: 1d1ec7f7af181c5c6cf07f512ce336dbdb367246
          path: .cpflow
          persist-credentials: false

      - name: Setup environment
        uses: ./.cpflow/.github/actions/cpflow-setup-environment
        with:
          token: ${{ secrets.CPLN_TOKEN_STAGING }}
          org: ${{ vars.CPLN_ORG_STAGING }}
          working_directory: .cpflow
          cpln_cli_version: ${{ vars.CPLN_CLI_VERSION }}
          cpflow_version: ${{ vars.CPFLOW_VERSION }}
          control_plane_flow_ref: shakacode/control-plane-flow/.github/workflows/cpflow-deploy-staging.yml@refs/tags/v5.2.0

      - name: Prepare renderer password
        run: ruby .controlplane/prepare_renderer_secret.rb

      - name: Apply benchmark app and renderer configuration
        run: cpflow apply-template app-inertia renderer -a "${APP_NAME}" --org "${CPLN_ORG}" --yes

      - name: Deploy staging image and verify rendering flag
        run: cpflow deploy-image -a "${APP_NAME}" --org "${CPLN_ORG}" --run-release-phase --verbose
