kind: workload
name: sidekiq
spec:
  type: standard
  containers:
    - name: sidekiq
      cpu: 500m
      memory: 1Gi
      volumes:
        - uri: "cpln://secret/{{APP_NAME}}-on-demand-startup.payload"
          path: /etc/gumroad-on-demand/startup.rb
      args:
        - ruby
        - /etc/gumroad-on-demand/startup.rb
        - bundle
        - exec
        - sidekiq
        - -q
        - critical
        - -q
        - default
        - -q
        - low
      inheritEnv: true
      image: "{{APP_IMAGE_LINK}}"
      livenessProbe:
        exec:
          command:
            - sh
            - -c
            - kill -0 1
        initialDelaySeconds: 30
        periodSeconds: 15
        failureThreshold: 3
      readinessProbe:
        exec:
          command:
            - sh
            - -c
            - kill -0 1
        initialDelaySeconds: 10
        periodSeconds: 10
        failureThreshold: 3
  defaultOptions:
    autoscaling:
      metric: keda
      minScale: 0
      maxScale: 1
      keda:
        pollingInterval: 10
        cooldownPeriod: 60
        fallback:
          failureThreshold: 3
          replicas: 1
        triggers:
          - type: prometheus
            metadata:
              serverAddress: https://metrics.cpln.io:443/metrics/org/{{APP_ORG}}
              query: max(replica_count{gvc="{{APP_NAME}}",workload="rails"} and (timestamp(replica_count{gvc="{{APP_NAME}}",workload="rails"}) > time() - 45)) or vector(0)
              threshold: '1'
              activationThreshold: '0'
              authModes: bearer
            authenticationRef:
              name: gumroad-on-demand-metrics
    capacityAI: true
    timeoutSeconds: 120
  firewallConfig:
    external:
      inboundAllowCIDR: []
      outboundAllowCIDR:
        - 0.0.0.0/0
    internal:
      inboundAllowType: same-gvc
  identityLink: "{{APP_IDENTITY_LINK}}"
