kind: workload
name: memcached
spec:
  type: standard
  containers:
    - name: memcached
      cpu: 50m
      memory: 64Mi
      image: memcached:1.6-alpine
      args:
        - -l
        - 0.0.0.0
      ports:
        - number: 11211
          protocol: tcp
      livenessProbe:
        tcpSocket:
          port: 11211
        initialDelaySeconds: 10
        periodSeconds: 10
        failureThreshold: 3
      readinessProbe:
        tcpSocket:
          port: 11211
        initialDelaySeconds: 2
        periodSeconds: 5
        failureThreshold: 3
  defaultOptions:
    autoscaling:
      metric: keda
      minScale: 0
      maxScale: 1
      keda:
        pollingInterval: 10
        cooldownPeriod: 180
        fallback:
          failureThreshold: 3
          replicas: 1
        triggers:
          - type: prometheus
            metadata:
              serverAddress: https://metrics.cpln.io:443/metrics/org/{{APP_ORG}}
              query: max(replica_count{gvc="{{APP_NAME}}",workload="rails"} and (timestamp(replica_count{gvc="{{APP_NAME}}",workload="rails"}) > time() - 45)) or vector(0)
              threshold: '1'
              activationThreshold: '0'
              authModes: bearer
            authenticationRef:
              name: gumroad-on-demand-metrics
    capacityAI: false
  firewallConfig:
    external:
      inboundAllowCIDR: []
      outboundAllowCIDR:
        - 0.0.0.0/0
    internal:
      inboundAllowType: same-gvc
