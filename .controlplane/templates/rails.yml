kind: workload
name: rails
spec:
  type: serverless
  containers:
    - name: rails
      cpu: "1"
      memory: 2Gi
      env:
        - name: PORT
          value: "3000"
      inheritEnv: true
      image: "{{APP_IMAGE_LINK}}"
      args:
        - ruby
        - .controlplane/on_demand_startup.rb
        - bundle
        - exec
        - rails
        - server
        - -b
        - 0.0.0.0
      ports:
        - number: 3000
          protocol: http
      livenessProbe:
        httpGet:
          path: /healthcheck
          port: 3000
        initialDelaySeconds: 120
        periodSeconds: 30
        failureThreshold: 16
      readinessProbe:
        httpGet:
          path: /healthcheck
          port: 3000
        initialDelaySeconds: 20
        periodSeconds: 10
        failureThreshold: 6
  defaultOptions:
    autoscaling:
      metric: concurrency
      target: 100
      minScale: 0
      maxScale: 1
      scaleToZeroDelay: 120
    capacityAI: true
    timeoutSeconds: 600
  firewallConfig:
    external:
      inboundAllowCIDR:
        - 0.0.0.0/0
      outboundAllowCIDR:
        - 0.0.0.0/0
    internal:
      inboundAllowType: same-gvc
  identityLink: "{{APP_IDENTITY_LINK}}"
