kind: volumeset
name: "{{APP_NAME}}-mongo-vs"
spec:
  autoscaling:
    maxCapacity: 20
    minFreePercentage: 1
    scalingFactor: 1.1
  fileSystemType: ext4
  initialCapacity: 10
  performanceClass: general-purpose-ssd
  snapshots:
    createFinalSnapshot: true
    retentionDuration: 7d

---
kind: workload
name: mongo
spec:
  type: stateful
  securityOptions:
    filesystemGroupId: 999
  containers:
    - name: mongo
      cpu: 100m
      memory: 512Mi
      image: mongo:4.0.19
      inheritEnv: false
      ports:
        - number: 27017
          protocol: tcp
      volumes:
        - uri: "cpln://volumeset/{{APP_NAME}}-mongo-vs"
          path: /data/db
          recoveryPolicy: retain
      livenessProbe:
        tcpSocket:
          port: 27017
        initialDelaySeconds: 20
        periodSeconds: 10
        failureThreshold: 6
      readinessProbe:
        tcpSocket:
          port: 27017
        initialDelaySeconds: 5
        periodSeconds: 10
        failureThreshold: 6
  defaultOptions:
    autoscaling:
      metric: keda
      minScale: 0
      maxScale: 1
      keda:
        pollingInterval: 10
        cooldownPeriod: 180
        fallback:
          failureThreshold: 3
          replicas: 1
        triggers:
          - type: prometheus
            metadata:
              serverAddress: https://metrics.cpln.io:443/metrics/org/{{APP_ORG}}
              query: max(replica_count{gvc="{{APP_NAME}}",workload="rails"} and (timestamp(replica_count{gvc="{{APP_NAME}}",workload="rails"}) > time() - 45)) or vector(0)
              threshold: '1'
              activationThreshold: '0'
              authModes: bearer
            authenticationRef:
              name: gumroad-on-demand-metrics
    capacityAI: false
    timeoutSeconds: 120
  firewallConfig:
    external:
      inboundAllowCIDR: []
      outboundAllowCIDR:
        - 0.0.0.0/0
    internal:
      inboundAllowType: same-gvc
