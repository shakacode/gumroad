kind: volumeset
name: "{{APP_NAME}}-redis-vs"
spec:
  fileSystemType: ext4
  initialCapacity: 10
  performanceClass: general-purpose-ssd
  snapshots:
    createFinalSnapshot: true
    retentionDuration: 7d

---
kind: workload
name: redis
spec:
  type: stateful
  securityOptions:
    filesystemGroupId: 999
  containers:
    - name: redis
      cpu: 100m
      memory: 128Mi
      image: redis:7.0.7
      args:
        - redis-server
        - --appendonly
        - "yes"
      volumes:
        - uri: "cpln://volumeset/{{APP_NAME}}-redis-vs"
          path: /data
          recoveryPolicy: retain
      ports:
        - number: 6379
          protocol: tcp
      livenessProbe:
        tcpSocket:
          port: 6379
        initialDelaySeconds: 10
        periodSeconds: 10
        failureThreshold: 3
      readinessProbe:
        tcpSocket:
          port: 6379
        initialDelaySeconds: 2
        periodSeconds: 5
        failureThreshold: 3
  defaultOptions:
    autoscaling:
      metric: keda
      minScale: 0
      maxScale: 1
      keda:
        pollingInterval: 10
        cooldownPeriod: 240
        fallback:
          failureThreshold: 3
          replicas: 1
        triggers:
          - type: prometheus
            metadata:
              serverAddress: https://metrics.cpln.io:443/metrics/org/{{APP_ORG}}
              query: max(replica_count{gvc="{{APP_NAME}}",workload="rails"} and (timestamp(replica_count{gvc="{{APP_NAME}}",workload="rails"}) > time() - 45)) or vector(0)
              threshold: '1'
              activationThreshold: '0'
              authModes: bearer
            authenticationRef:
              name: gumroad-on-demand-metrics
    capacityAI: false
  firewallConfig:
    external:
      inboundAllowCIDR: []
      outboundAllowCIDR:
        - 0.0.0.0/0
    internal:
      inboundAllowType: same-gvc
