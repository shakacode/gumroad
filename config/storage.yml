test:
  service: S3
  endpoint: <%= GlobalConfig.get("AWS_S3_ENDPOINT") %>
  access_key_id: <%= GlobalConfig.get("AWS_ACCESS_KEY_ID") %>
  secret_access_key: <%= GlobalConfig.get("AWS_SECRET_ACCESS_KEY") %>
  region: us-east-1
  bucket: <%= PUBLIC_STORAGE_S3_BUCKET %>
  public: true
  force_path_style: true

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# MinIO for development
development:
  service: S3
  endpoint: <%= GlobalConfig.get("AWS_S3_ENDPOINT") %>
  access_key_id: <%= GlobalConfig.get("AWS_ACCESS_KEY_ID") %>
  secret_access_key: <%= GlobalConfig.get("AWS_SECRET_ACCESS_KEY") %>
  region: us-east-1
  bucket: <%= PUBLIC_STORAGE_S3_BUCKET %>
  public: true
  force_path_style: true

benchmark:
<% if ENV["CONTROL_PLANE_BENCHMARK"] == "true" %>
  service: PrefixedS3
  endpoint: <%= GlobalConfig.get("BENCHMARK_STORAGE_S3_ENDPOINT") %>
  access_key_id: <%= GlobalConfig.get("BENCHMARK_STORAGE_S3_ACCESS_KEY_ID") %>
  secret_access_key: <%= GlobalConfig.get("BENCHMARK_STORAGE_S3_SECRET_ACCESS_KEY") %>
  region: <%= GlobalConfig.get("BENCHMARK_STORAGE_S3_REGION", "auto") %>
  bucket: <%= GlobalConfig.get("BENCHMARK_STORAGE_S3_BUCKET") %>
  public: false
  force_path_style: true
  prefix: <%= ENV.fetch("BENCHMARK_STORAGE_PREFIX", "benchmarks/gumroad-rorp") %>
  public_host: <%= GlobalConfig.get("BENCHMARK_STORAGE_PUBLIC_HOST") %>
<% else %>
  service: S3
  endpoint: <%= GlobalConfig.get("AWS_S3_ENDPOINT") %>
  access_key_id: <%= GlobalConfig.get("AWS_ACCESS_KEY_ID") %>
  secret_access_key: <%= GlobalConfig.get("AWS_SECRET_ACCESS_KEY") %>
  region: us-east-1
  bucket: <%= PUBLIC_STORAGE_S3_BUCKET %>
  public: true
  force_path_style: true
<% end %>

# Use rails credentials:edit to set the AWS secrets (as aws:access_key_id|secret_access_key)
amazon:
  service: S3
  access_key_id: <%= GlobalConfig.get("AWS_ACCESS_KEY_ID") %>
  secret_access_key: <%= GlobalConfig.get("AWS_SECRET_ACCESS_KEY") %>
  region: us-east-1
  bucket: <%= PUBLIC_STORAGE_S3_BUCKET %>
  public: true
