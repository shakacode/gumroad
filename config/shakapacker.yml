# React on Rails reads Shakapacker's private bundle location even though Vite
# remains the application's browser-asset pipeline.
default: &default
  source_path: app/javascript
  source_entry_path: entrypoints/public_rsc
  nested_entries: false
  public_root_path: public
  public_output_path: product-rsc
  private_output_path: ssr-generated
  cache_path: tmp/shakapacker
  cache_manifest: false
  compile: false
  shakapacker_precompile: false
  assets_bundler: rspack

development:
  <<: *default

test:
  <<: *default

benchmark:
  <<: *default

production:
  <<: *default
