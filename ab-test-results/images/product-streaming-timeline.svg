<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" aria-labelledby="title description" font-family="Arial,Helvetica,sans-serif"><desc>Same-scale timing lanes from one throttled Product phone diagnostic navigation. Inertia first paint: 10.10 seconds. React on Rails Pro first paint: 1.16 seconds; its document completes at 0.32 seconds. JavaScript bands combine overlapping measured requests, not CPU execution time.</desc><path fill="#f9fafb" d="M0 0h1200v900H0z"/><text x="44" y="48" fill="#162334" font-size="30" font-weight="700">Performance profile: Inertia vs RSC</text><text x="44" y="78" fill="#162334" font-size="16">Product Page (discover layout) [3] · throttled phone · one diagnostic load · September 7</text><text x="250" y="116" fill="#162334" font-size="15">Seconds since navigation →</text><path stroke="#dbe2e9" d="M250 150v542"/><text x="250" y="140" fill="#162334" font-size="14" text-anchor="middle">0</text><path stroke="#dbe2e9" d="M408.182 150v542"/><text x="408.182" y="140" fill="#162334" font-size="14" text-anchor="middle">2</text><path stroke="#dbe2e9" d="M566.364 150v542"/><text x="566.364" y="140" fill="#162334" font-size="14" text-anchor="middle">4</text><path stroke="#dbe2e9" d="M724.545 150v542"/><text x="724.545" y="140" fill="#162334" font-size="14" text-anchor="middle">6</text><path stroke="#dbe2e9" d="M882.727 150v542"/><text x="882.727" y="140" fill="#162334" font-size="14" text-anchor="middle">8</text><path stroke="#dbe2e9" d="M1040.909 150v542"/><text x="1040.909" y="140" fill="#162334" font-size="14" text-anchor="middle">10</text><text x="44" y="190" fill="#162334" font-size="20" font-weight="700">Inertia control</text><text x="232" y="226" fill="#162334" font-size="14" text-anchor="end">Document transfer</text><rect width="19.91" height="20" x="250.033" y="210" fill="#2a78d6" rx="3"/><text x="232" y="258" fill="#162334" font-size="14" text-anchor="end">Page JS transfer</text><rect width="27.628" height="20" x="580.717" y="242"