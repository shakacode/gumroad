7" height="20" x="269.821" y="592" fill="#eb6834" opacity=".65" rx="3"/><text x="232" y="568" fill="#162334" font-size="14" text-anchor="end">Other JS downloads</text><rect width="427.124" height="36" x="269.078" y="544" fill="#eb6834" opacity=".18" rx="3"/><rect width="274.321" height="36" x="700.66" y="544" fill="#eb6834" opacity=".18" rx="3"/><rect width="17.791" height="36" x="988.876" y="544" fill="#eb6834" opacity=".18" rx="3"/><text x="358.012" y="567" fill="#162334" font-size="15">Client JavaScript continues after first paint</text><path stroke="#15803d" stroke-dasharray="4 4" stroke-width="2" d="M342.012 472v164"/><circle cx="342.012" cy="636" r="6" fill="#15803d"/><text x="354.012" y="641" fill="#162334" font-size="17" font-weight="700">FCP 1.16 s</text><text x="354.012" y="666" fill="#162334" font-size="15">LCP 2.07 s</text><text x="284.054" y="495" fill="#162334" font-size="14">0.32 s</text><rect width="1112" height="62" x="44" y="722" fill="#e9f5ed" rx="8"/><text x="64" y="749" fill="#162334" font-size="20" font-weight="700">RORP first paint: 1.16 s. Document complete: 0.32 s.</text><text x="64" y="772" fill="#162334" font-size="16">The browser shows the page while client JavaScript continues downloading.</text><text x="44" y="818" fill="#162334" font-size="15">First image requests: 0.24 s control / 0.25 s RORP. Both begin early.</text><text x="44" y="844" fill="#162334" font-size="15">JS bands combine overlapping recorded downloads; their width is elapsed loading time, not CPU time.</text><text x="44" y="878" fill="#162334" font-size="13">Source: compare-results-sep-7-4am · Product / Discover layout · phone · diagnostic values, not aggregate medians</text></svg>