<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description" font-family="Arial,Helvetica,sans-serif"><title id="title">Gumroad Product: paint while JavaScript loads</title><desc id="description">Same-scale timing lanes from one throttled Product phone diagnostic navigation. Inertia first paint: 10.03 seconds. React on Rails Pro first paint: 1.23 seconds; its document completes at 0.32 seconds. JavaScript bands combine overlapping measured requests, not CPU execution time.</desc><rect width="1200" height="900" fill="#f9fafb"/><text x="44" y="48" font-size="30" fill="#162334" font-weight="700">Gumroad Product: paint while JavaScript loads</text><text x="44" y="78" font-size="16" fill="#162334" >Throttled phone · one low-noise diagnostic capture · September 4</text><text x="250" y="116" font-size="15" fill="#162334" >Seconds since navigation →</text><line x1="250" y1="150" x2="250" y2="692" stroke="#dbe2e9"/><text x="250" y="140" font-size="14" fill="#162334" text-anchor="middle">0</text><line x1="395" y1="150" x2="395" y2="692" stroke="#dbe2e9"/><text x="395" y="140" font-size="14" fill="#162334" text-anchor="middle">2</text><line x1="540" y1="150" x2="540" y2="692" stroke="#dbe2e9"/><text x="540" y="140" font-size="14" fill="#162334" text-anchor="middle">4</text><line x1="685" y1="150" x2="685" y2="692" stroke="#dbe2e9"/><text x="685" y="140" font-size="14" fill="#162334" text-anchor="middle">6</text><line x1="830" y1="150" x2="830" y2="692" stroke="#dbe2e9"/><text x="830" y="140" font-size="14" fill="#162334" text-anchor="middle">8</text><line x1="975" y1="150" x2="975" y2="692" stroke="#dbe2e9"/><text x="975" y="140" font-size="14" fill="#162334" text-anchor="middle">10</text><line x1="1120" y1="150" x2="1120" y2="692" stroke="#dbe2e9"/><text x="1120" y="140" font-size="14" fill="#162334" text-anchor="middle">12</text><text x="44" y="190" font-size="20" fill="#162334" font-weight="700">Inertia control</text><text x="232" y="226" font-size="14" fill="#162334" text-anchor="end">Document transfer</text><rect x="250.02486749961972" y="210" width="18.341847501918693" height="20" rx="3" fill="#2a78d6" opacity="1"/><text x="232" y="258" font-size="14" fill="#162334" text-anchor="end">Page JS transfer</text><rect x="553.3606624997408" y="242" width="26.49882249906659" height="20" rx="3" fill="#2a78d6" opacity="0.65"/><text x="232" y="338" font-size="14" fill="#162334" text-anchor="end">First image transfer</text><rect x="267.33996999934317" y="322" width="124.07635500013828" height="20" rx="3" fill="#2a78d6" opacity="0.65"/><text x="232" y="298" font-size="14" fill="#162334" text-anchor="end">Other JS downloads</text><rect x="268.4283399989456" y="274" width="272.09373250141743" height="36" rx="3" fill="#2a78d6" opacity="0.18"/><rect x="553.375597499758" y="274" width="411.99509749889376" height="36" rx="3" fill="#2a78d6" opacity="0.18"/><rect x="1017.6457324983925" y="274" width="36.556240000501134" height="36" rx="3" fill="#2a78d6" opacity="0.18"/><rect x="1058.5521174991877" y="274" width="1" height="36" rx="3" fill="#2a78d6" opacity="0.18"/><text x="404.4752062496543" y="297" font-size="15" fill="#162334" text-anchor="middle">App + shared JavaScript</text><text x="759.3731462492049" y="297" font-size="15" fill="#162334" text-anchor="middle">Product modules + dependencies</text><text x="250" y="426" font-size="16" fill="#162334" >JavaScript downloads continue to 9.87 s; first paint follows at 10.03 s.</text><line x1="977.369155" y1="202" x2="977.369155" y2="366" stroke="#15803d" stroke-width="2" stroke-dasharray="4 4"/><circle cx="977.369155" cy="366" r="6" fill="#15803d"/><text x="965.369155" y="371" font-size="17" fill="#162334" text-anchor="end" font-weight="700">FCP 10.03 s</text><text x="965.369155" y="396" font-size="15" fill="#162334" text-anchor="end">LCP 10.10 s</text><text x="277.3667150015384" y="225" font-size="14" fill="#162334" >0.25 s</text><text x="44" y="460" font-size="20" fill="#162334" font-weight="700">React on Rails Pro</text><text x="232" y="496" font-size="14" fill="#162334" text-anchor="end">Document transfer</text><rect x="250.02421499937773" y="480" width="23.10937499999997" height="20" rx="3" fill="#eb6834" opacity="1"/><text x="232" y="528" font-size="14" fill="#162334" text-anchor="end">Page JS transfer</text><rect x="266.85472750015555" y="512" width="36.97644999861717" height="20" rx="3" fill="#eb6834" opacity="0.65"/><text x="232" y="608" font-size="14" fill="#162334" text-anchor="end">First image transfer</text><rect x="267.4997599990666" y="592" width="138.2846150009334" height="20" rx="3" fill="#eb6834" opacity="0.65"/><text x="232" y="568" font-size="14" fill="#162334" text-anchor="end">Other JS downloads</text><rect x="266.80223749965427" y="544" width="388.8884775001556" height="36" rx="3" fill="#eb6834" opacity="0.18"/><rect x="659.6223899990321" y="544" width="108.5799150010198" height="36" rx="3" fill="#eb6834" opacity="0.18"/><rect x="773.0863399998099" y="544" width="1" height="36" rx="3" fill="#eb6834" opacity="0.18"/><text x="355.3181875" y="567" font-size="15" fill="#162334" >Client JavaScript continues after first paint</text><line x1="339.3181875" y1="472" x2="339.3181875" y2="636" stroke="#15803d" stroke-width="2" stroke-dasharray="4 4"/><circle cx="339.3181875" cy="636" r="6" fill="#15803d"/><text x="351.3181875" y="641" font-size="17" fill="#162334"  font-weight="700">FCP 1.23 s</text><text x="351.3181875" y="666" font-size="15" fill="#162334" >LCP 2.16 s</text><text x="282.1335899993777" y="495" font-size="14" fill="#162334" >0.32 s</text><rect x="44" y="722" width="1112" height="62" rx="8" fill="#e9f5ed"/><text x="64" y="749" font-size="20" fill="#162334" font-weight="700">RORP first paint: 1.23 s. Document complete: 0.32 s.</text><text x="64" y="772" font-size="16" fill="#162334" >The browser shows the page while client JavaScript continues downloading.</text><text x="44" y="818" font-size="15" fill="#162334" >First image requests: 0.24 s control / 0.24 s RORP. Both begin early.</text><text x="44" y="844" font-size="15" fill="#162334" >JS bands combine overlapping recorded downloads; their width is elapsed loading time, not CPU time.</text><text x="44" y="878" font-size="13" fill="#162334" >Source: compare-results-4-sep-8am · Product / Discover layout · phone · diagnostic values, not aggregate medians</text></svg>
