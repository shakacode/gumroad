<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description" font-family="Arial,Helvetica,sans-serif"><title id="title">Gumroad Product: paint during the stream</title><desc id="description">Same-scale timing lanes from one throttled Product phone diagnostic navigation. Inertia downloads app and shared JavaScript, then Product modules and dependencies until 9.78 seconds; first paint follows at 9.97 seconds. React on Rails Pro paints at 1.30 seconds while its document and client JavaScript continue arriving. JavaScript bands combine overlapping measured requests, not CPU execution time.</desc><rect width="1200" height="900" fill="#f9fafb"/><text x="44" y="48" font-size="30" fill="#162334" font-weight="700">Gumroad Product: paint during the stream</text><text x="44" y="78" font-size="16" fill="#162334" >Throttled phone · one low-noise diagnostic capture · September 1</text><text x="250" y="116" font-size="15" fill="#162334" >Seconds since navigation →</text><line x1="250" y1="150" x2="250" y2="692" stroke="#dbe2e9"/><text x="250" y="140" font-size="14" fill="#162334" text-anchor="middle">0</text><line x1="395" y1="150" x2="395" y2="692" stroke="#dbe2e9"/><text x="395" y="140" font-size="14" fill="#162334" text-anchor="middle">2</text><line x1="540" y1="150" x2="540" y2="692" stroke="#dbe2e9"/><text x="540" y="140" font-size="14" fill="#162334" text-anchor="middle">4</text><line x1="685" y1="150" x2="685" y2="692" stroke="#dbe2e9"/><text x="685" y="140" font-size="14" fill="#162334" text-anchor="middle">6</text><line x1="830" y1="150" x2="830" y2="692" stroke="#dbe2e9"/><text x="830" y="140" font-size="14" fill="#162334" text-anchor="middle">8</text><line x1="975" y1="150" x2="975" y2="692" stroke="#dbe2e9"/><text x="975" y="140" font-size="14" fill="#162334" text-anchor="middle">10</text><line x1="1120" y1="150" x2="1120" y2="692" stroke="#dbe2e9"/><text x="1120" y="140" font-size="14" fill="#162334" text-anchor="middle">12</text><text x="44" y="190" font-size="20" fill="#162334" font-weight="700">Inertia control</text><text x="232" y="226" font-size="14" fill="#162334" text-anchor="end">Document transfer</text><rect x="250.03936749997084" y="210" width="18.52976750004106" height="20" rx="3" fill="#2a78d6" opacity="1"/><text x="232" y="258" font-size="14" fill="#162334" text-anchor="end">Page JS transfer</text><rect x="553.9304400000233" y="242" width="23.302949999994553" height="20" rx="3" fill="#2a78d6" opacity="0.65"/><text x="232" y="338" font-size="14" fill="#162334" text-anchor="end">First image transfer</text><rect x="268.0255299999681" y="322" width="123.86929500002651" height="20" rx="3" fill="#2a78d6" opacity="0.65"/><text x="232" y="298" font-size="14" fill="#162334" text-anchor="end">Other JS downloads</text><rect x="268.70558000002757" y="274" width="272.37176999992926" height="36" rx="3" fill="#2a78d6" opacity="0.18"/><rect x="553.9484199999995" y="274" width="404.96078500001454" height="36" rx="3" fill="#2a78d6" opacity="0.18"/><rect x="1013.4006399999909" y="274" width="36.61554500002637" height="36" rx="3" fill="#2a78d6" opacity="0.18"/><rect x="1054.7820449999858" y="274" width="1" height="36" rx="3" fill="#2a78d6" opacity="0.18"/><text x="404.8914649999922" y="297" font-size="15" fill="#162334" text-anchor="middle">App + shared JavaScript</text><text x="756.4288125000068" y="297" font-size="15" fill="#162334" text-anchor="middle">Product modules + dependencies</text><text x="250" y="426" font-size="16" fill="#162334" >JavaScript downloads continue to 9.78 s; first paint follows at 9.97 s.</text><line x1="972.80325" y1="202" x2="972.80325" y2="366" stroke="#15803d" stroke-width="2" stroke-dasharray="4 4"/><circle cx="972.80325" cy="366" r="6" fill="#15803d"/><text x="960.80325" y="371" font-size="17" fill="#162334" text-anchor="end" font-weight="700">FCP 9.97 s</text><text x="960.80325" y="396" font-size="15" fill="#162334" text-anchor="end">LCP 10.04 s</text><text x="277.5691350000119" y="225" font-size="14" fill="#162334" >0.26 s</text><text x="44" y="460" font-size="20" fill="#162334" font-weight="700">React on Rails Pro</text><text x="232" y="496" font-size="14" fill="#162334" text-anchor="end">Document transfer</text><rect x="250.0358875000081" y="480" width="289.1389900000556" height="20" rx="3" fill="#eb6834" opacity="1"/><text x="232" y="528" font-size="14" fill="#162334" text-anchor="end">Page JS transfer</text><rect x="266.5673375000432" y="512" width="37.26144750002538" height="20" rx="3" fill="#eb6834" opacity="0.65"/><text x="232" y="608" font-size="14" fill="#162334" text-anchor="end">First image transfer</text><rect x="267.92250750002916" y="592" width="146.95481750003296" height="20" rx="3" fill="#eb6834" opacity="0.65"/><text x="232" y="568" font-size="14" fill="#162334" text-anchor="end">Other JS downloads</text><rect x="266.5455874999892" y="544" width="422.99588500006587" height="36" rx="3" fill="#eb6834" opacity="0.18"/><rect x="694.3236450000643" y="544" width="105.2691299999924" height="36" rx="3" fill="#eb6834" opacity="0.18"/><rect x="804.7253400000394" y="544" width="1" height="36" rx="3" fill="#eb6834" opacity="0.18"/><text x="360.0782475" y="567" font-size="15" fill="#162334" >Client JavaScript continues after first paint</text><line x1="344.0782475" y1="472" x2="344.0782475" y2="636" stroke="#15803d" stroke-width="2" stroke-dasharray="4 4"/><circle cx="344.0782475" cy="636" r="6" fill="#15803d"/><text x="356.0782475" y="641" font-size="17" fill="#162334"  font-weight="700">FCP 1.30 s</text><text x="356.0782475" y="666" font-size="15" fill="#162334" >LCP 2.28 s</text><text x="548.1748775000638" y="495" font-size="14" fill="#162334" >3.99 s</text><rect x="44" y="722" width="1112" height="62" rx="8" fill="#e9f5ed"/><text x="64" y="749" font-size="20" fill="#162334" font-weight="700">RORP first paint: 1.30 s. Document complete: 3.99 s.</text><text x="64" y="772" font-size="16" fill="#162334" >The browser can show the page while the response continues streaming.</text><text x="44" y="818" font-size="15" fill="#162334" >First image requests: 0.25 s control / 0.25 s RORP. Both begin early.</text><text x="44" y="844" font-size="15" fill="#162334" >JS bands combine overlapping recorded downloads; their width is elapsed loading time, not CPU time.</text><text x="44" y="878" font-size="13" fill="#162334" >Source: compare-results-1-sep-11pm · Product / Discover layout · phone · diagnostic values, not aggregate medians</text></svg>
