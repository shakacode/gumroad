<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-labelledby="title description"><title id="title">Metric classifications across 22 successful throttled cases</title><desc id="description">FCP, LCP, total request count, and JavaScript request count improved in all 22 cases; byte and TTFB results were mixed.</desc><rect width="1200" height="640" fill="#fcfcfb"/><text x="56" y="58" font-size="24" font-weight="650" fill="#0b0b0b">The repeated win was earlier paint and fewer requests</text><text x="56" y="86" font-size="14" fill="#52514e">22 successful main-perf comparisons under 1 throttled profile; all selected cases measured.</text><rect x="56" y="108" width="12" height="12" rx="3" fill="#18864b"/><text x="74" y="119" font-size="13" fill="#52514e">Improvement</text><rect x="170" y="108" width="12" height="12" rx="3" fill="#cc3d3d"/><text x="188" y="119" font-size="13" fill="#52514e">Regression</text><rect x="278" y="108" width="12" height="12" rx="3" fill="#c9c8c3"/><text x="296" y="119" font-size="13" fill="#52514e">No classified difference</text><text x="274" y="180" font-size="14" fill="#0b0b0b" text-anchor="end">FCP</text><rect x="290" y="158" width="820" height="30" fill="#18864b"/><text x="700" y="179" font-size="13" font-weight="650" fill="#fff" text-anchor="middle">22</text><text x="274" y="235" font-size="14" fill="#0b0b0b" text-anchor="end">LCP</text><rect x="290" y="213" width="820" height="30" fill="#18864b"/><text x="700" y="234" font-size="13" font-weight="650" fill="#fff" text-anchor="middle">22</text><text x="274" y="290" font-size="14" fill="#0b0b0b" text-anchor="end">Total requests</text><rect x="290" y="268" width="820" height="30" fill="#18864b"/><text x="700" y="289" font-size="13" font-weight="650" fill="#fff" text-anchor="middle">22</text><text x="274" y="345" font-size="14" fill="#0b0b0b" text-anchor="end">JavaScript requests</text><rect x="290" y="323" width="820" height="30" fill="#18864b"/><text x="700" y="344" font-size="13" font-weight="650" fill="#fff" text-anchor="middle">22</text><text x="274" y="400" font-size="14" fill="#0b0b0b" text-anchor="end">TTFB</text><rect x="290" y="378" width="111.81818181818181" height="30" fill="#18864b"/><text x="345.9090909090909" y="399" font-size="13" font-weight="650" fill="#fff" text-anchor="middle">3</text><rect x="401.8181818181818" y="378" width="149.0909090909091" height="30" fill="#cc3d3d"/><text x="476.3636363636364" y="399" font-size="13" font-weight="650" fill="#fff" text-anchor="middle">4</text><rect x="550.9090909090909" y="378" width="559.0909090909091" height="30" fill="#c9c8c3"/><text x="830.4545454545455" y="399" font-size="13" font-weight="650" fill="#333" text-anchor="middle">15</text><text x="274" y="455" font-size="14" fill="#0b0b0b" text-anchor="end">Total bytes</text><rect x="290" y="433" width="223.63636363636363" height="30" fill="#18864b"/><text x="401.8181818181818" y="454" font-size="13" font-weight="650" fill="#fff" text-anchor="middle">6</text><rect x="513.6363636363636" y="433" width="596.3636363636364" height="30" fill="#cc3d3d"/><text x="811.8181818181818" y="454" font-size="13" font-weight="650" fill="#fff" text-anchor="middle">16</text><text x="274" y="510" font-size="14" fill="#0b0b0b" text-anchor="end">JavaScript bytes</text><rect x="290" y="488" width="298.1818181818182" height="30" fill="#18864b"/><text x="439.0909090909091" y="509" font-size="13" font-weight="650" fill="#fff" text-anchor="middle">8</text><rect x="588.1818181818182" y="488" width="149.0909090909091" height="30" fill="#cc3d3d"/><text x="662.7272727272727" y="509" font-size="13" font-weight="650" fill="#fff" text-anchor="middle">4</text><rect x="737.2727272727274" y="488" width="372.72727272727275" height="30" fill="#c9c8c3"/><text x="923.6363636363637" y="509" font-size="13" font-weight="650" fill="#333" text-anchor="middle">10</text><text x="274" y="565" font-size="14" fill="#0b0b0b" text-anchor="end">TBT</text><rect x="290" y="543" width="820" height="30" fill="#c9c8c3"/><text x="700" y="564" font-size="13" font-weight="650" fill="#333" text-anchor="middle">22</text><text x="56" y="618" font-size="13" fill="#777570">Per-case classifications pass ShakaPerf's statistical/practical gate; counts are not a pooled effect size.</text></svg>