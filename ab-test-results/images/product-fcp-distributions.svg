<title id="title">First paint times: cold and warm ranges</title><desc id="description">Hatched amber markers and dark amber range lines are Inertia; solid blue markers and lines are RSC. Each series is labeled. Cold visits use a 0–18-second scale. Warm visits use a 0–1000-millisecond scale. Each line shows the range of 20 raw first-contentful-paint measurements; each circle shows the median.</desc>
